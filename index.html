<!-- POSITION SECTION -->
<fieldset>
  <legend>Position you're applying for</legend>

  <label>
    Select position <strong>*</strong>
    <select name="Position_Key__c" id="positionSelect" required>
      <option value="">Select a position…</option>
      <option value="SF_DEV" data-position-name="Salesforce Developer">Salesforce Developer</option>
      <option value="SF_ADMIN" data-position-name="Salesforce Administrator">Salesforce Administrator</option>
      <option value="SF_MC_DEV" data-position-name="Salesforce Marketing Cloud Developer">Salesforce Marketing Cloud Developer</option>
    </select>
    <span class="help-text">
      This key is used by the Flow to find/create the related Position__c and Application__c record.
    </span>
  </label>

  <!-- Hidden field carries the human-readable name too, useful for payload/debug -->
  <input type="hidden" name="Desired_Position_Title__c" id="desiredPositionTitle" />
</fieldset>
